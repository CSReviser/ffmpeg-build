name: Build FFmpeg ubuntu Static

on:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        ubuntu:
          - "22.04"
          - "24.04"
          - "26.04"

    runs-on: ubuntu-${{ matrix.ubuntu }}

    env:
      FFMPEG_VERSION: "9.0.2"
      LAME_VERSION: "3.100"

    steps:
      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            autoconf automake build-essential cmake libtool git \
            pkg-config texinfo nasm yasm \
            libssl-dev libmp3lame-dev libmpg123-dev \
            zlib1g-dev libfdk-aac-dev

      - name: Build static mpg123
        run: |
          wget https://www.mpg123.de/download/mpg123-1.33.3.tar.bz2
          tar -xjf mpg123-1.33.3.tar.bz2
          cd mpg123-1.33.3

          ./configure \
            --prefix="$HOME/mpg123-static" \
            --disable-shared \
            --enable-static \
            --disable-debug \
            --disable-lfs-alias \
            --with-default-audio=no

          make -j$(nproc)
          make install

          echo "=== mpg123 static library ==="
          ls -l "$HOME/mpg123-static/lib/"

      - name: Build FFmpeg
        run: |
          wget https://ffmpeg.org/releases/ffmpeg-${FFMPEG_VERSION}.tar.gz
          tar -xzf ffmpeg-${FFMPEG_VERSION}.tar.gz

          cd ffmpeg-${FFMPEG_VERSION}

          MULTIARCH="$(dpkg-architecture -qDEB_HOST_MULTIARCH)"

          ./configure \
            --prefix="$HOME/ffmpeg-static" \
            --pkg-config-flags="--static" \
            --extra-cflags="-I/usr/include" \
            --extra-ldflags="-static -L/usr/lib/$MULTIARCH" \
            --enable-gpl \
            --enable-nonfree \
            --enable-libmp3lame \
            --enable-libfdk-aac \
            --enable-encoder=png,jpeg \
            --enable-openssl \
            --enable-protocol=https \
            --enable-protocol=hls \
            --disable-shared \
           --enable-static \
            --disable-debug \
            --disable-doc \
          || {
            echo "=== libmp3lame configure failure ==="
            grep -n -A30 -B10 "libmp3lame" ffbuild/config.log || true
            exit 1
          }
          make -j"$(nproc)"
          make install

          
      - name: Prepare artifact
        run: |
          mkdir -p "ffmpeg-${{ matrix.ubuntu }}"
          cp "$HOME/ffmpeg-static/bin/ffmpeg" \
             "ffmpeg-${{ matrix.ubuntu }}/ffmpeg"

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-${{ matrix.ubuntu }}
          path: ffmpeg-${{ matrix.ubuntu }}

  package:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download Ubuntu 22.04
        uses: actions/download-artifact@v4
        with:
          name: ffmpeg-22.04
          path: ffmpeg-static/ubuntu-22.04

      - name: Download Ubuntu 24.04
        uses: actions/download-artifact@v4
        with:
          name: ffmpeg-24.04
          path: ffmpeg-static/ubuntu-24.04

      - name: Download Ubuntu 26.04
        uses: actions/download-artifact@v4
        with:
          name: ffmpeg-26.04
          path: ffmpeg-static/ubuntu-26.04

      - name: Upload combined artifact
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-static
          path: ffmpeg-static
