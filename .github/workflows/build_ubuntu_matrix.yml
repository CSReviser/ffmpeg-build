name: Build FFmpeg ubuntu Static

on:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        ubuntu:
          - "22.04"
          - "24.04"
          - "26.04"

    runs-on: ubuntu-${{ matrix.ubuntu }}

    env:
      FFMPEG_VERSION: "9.0.2"
      LAME_VERSION: "3.100"

    steps:
      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            autoconf automake build-essential cmake libtool git \
            pkg-config texinfo nasm yasm \
            libssl-dev libmp3lame-dev zlib1g-dev libfdk-aac-dev

      - name: Build static LAME
        shell: bash
        run: |
          set -euo pipefail
          curl -fL -o "lame-${LAME_VERSION}.tar.gz" \
            "https://downloads.sourceforge.net/project/lame/lame/${LAME_VERSION}/lame-${LAME_VERSION}.tar.gz"
          tar -xzf "lame-${LAME_VERSION}.tar.gz"     
          cd "$GITHUB_WORKSPACE/src/lame-${LAME_VERSION}"
          ./configure \
            --prefix="$LAME_ROOT" \
            --disable-shared \
            --enable-static \
            --disable-nasm
          make -j"$(sysctl -n hw.ncpu)"
          make install
          test -f "$LAME_ROOT/lib/libmp3lame.a"
          test -f "$LAME_ROOT/include/lame/lame.h"
          file "$LAME_ROOT/lib/libmp3lame.a"
          
      - name: Configure pkg-config
        run: |
          PC_FILE="$(dpkg -L libmp3lame-dev | grep '/libmp3lame\.pc$' | head -n 1)"

          if [ -z "$PC_FILE" ]; then
            echo "libmp3lame.pc not found"
            exit 1
          fi

          PC_DIR="$(dirname "$PC_FILE")"

          echo "libmp3lame.pc: $PC_FILE"
          echo "PKG_CONFIG_PATH: $PC_DIR"

          echo "PKG_CONFIG_PATH=$PC_DIR${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}" >> "$GITHUB_ENV"

      - name: Check LAME
        run: |
          echo "=== packages ==="
          dpkg -l | grep -E 'libmp3lame|lame' || true

          echo "=== pkg-config ==="
          pkg-config --modversion libmp3lame
          pkg-config --cflags libmp3lame
          pkg-config --libs libmp3lame
          pkg-config --static --libs libmp3lame

      - name: Build FFmpeg
        run: |
          wget https://ffmpeg.org/releases/ffmpeg-${FFMPEG_VERSION}.tar.gz
          tar -xzf ffmpeg-${FFMPEG_VERSION}.tar.gz

          cd ffmpeg-${FFMPEG_VERSION}

          ./configure \
            --prefix="$HOME/ffmpeg-static" \
            --pkg-config-flags="--static" \
            --extra-cflags="-static -I/usr/include" \
            --extra-ldflags="-static -L/usr/lib" \
            --enable-gpl \
            --enable-nonfree \
            --enable-libmp3lame \
            --enable-libfdk-aac \
            --enable-encoder=png,jpeg \
            --enable-openssl \
            --enable-protocol=https \
            --enable-protocol=hls \
            --disable-shared \
            --enable-static \
            --disable-debug \
            --disable-doc

          make -j"$(nproc)"
          make install

      - name: Prepare artifact
        run: |
          mkdir -p "ffmpeg-${{ matrix.ubuntu }}"
          cp "$HOME/ffmpeg-static/bin/ffmpeg" \
             "ffmpeg-${{ matrix.ubuntu }}/ffmpeg"

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-${{ matrix.ubuntu }}
          path: ffmpeg-${{ matrix.ubuntu }}

  package:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download Ubuntu 22.04
        uses: actions/download-artifact@v4
        with:
          name: ffmpeg-22.04
          path: ffmpeg-static/ubuntu-22.04

      - name: Download Ubuntu 24.04
        uses: actions/download-artifact@v4
        with:
          name: ffmpeg-24.04
          path: ffmpeg-static/ubuntu-24.04

      - name: Download Ubuntu 26.04
        uses: actions/download-artifact@v4
        with:
          name: ffmpeg-26.04
          path: ffmpeg-static/ubuntu-26.04

      - name: Upload combined artifact
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-static
          path: ffmpeg-static
