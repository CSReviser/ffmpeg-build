name: Build FFmpeg (macOS arm64, self-contained)

on:
  workflow_dispatch:

jobs:
  build-ffmpeg-arm64:
    # GitHub-hosted Apple Silicon runner
    runs-on: macos-latest

    env:
      FFMPEG_VERSION: "9.0.2"
      LAME_VERSION: "3.100"
      # Fixed source release. Update this deliberately when updating OpenSSL.
      OPENSSL_VERSION: "3.0.18"

      PREFIX: ${{ github.workspace }}/prefix
      LAME_ROOT: ${{ github.workspace }}/prefix/lame
      OPENSSL_ROOT: ${{ github.workspace }}/prefix/openssl
      TARGET_DIR: ${{ github.workspace }}/package-root

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Apple Silicon runner
        shell: bash
        run: |
          set -euo pipefail
          uname -m
          test "$(uname -m)" = "arm64"

      - name: Download source archives
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$GITHUB_WORKSPACE/src"
          cd "$GITHUB_WORKSPACE/src"

          curl -fL -o "ffmpeg-${FFMPEG_VERSION}.tar.xz" \
            "https://ffmpeg.org/releases/ffmpeg-${FFMPEG_VERSION}.tar.xz"

          curl -fL -o "lame-${LAME_VERSION}.tar.gz" \
            "https://downloads.sourceforge.net/project/lame/lame/${LAME_VERSION}/lame-${LAME_VERSION}.tar.gz"

          curl -fL -o "openssl-${OPENSSL_VERSION}.tar.gz" \
            "https://www.openssl.org/source/openssl-${OPENSSL_VERSION}.tar.gz"

          tar -xJf "ffmpeg-${FFMPEG_VERSION}.tar.xz"
          tar -xzf "lame-${LAME_VERSION}.tar.gz"
          tar -xzf "openssl-${OPENSSL_VERSION}.tar.gz"

      - name: Build static OpenSSL
        shell: bash
        run: |
          set -euo pipefail

          cd "$GITHUB_WORKSPACE/src/openssl-${OPENSSL_VERSION}"

          # no-shared prevents libssl.dylib/libcrypto.dylib from being produced.
          ./Configure darwin64-arm64-cc \
            no-shared \
            no-module \
            no-tests \
            no-zlib \
            --prefix="$OPENSSL_ROOT" \
            --openssldir="$OPENSSL_ROOT/ssl"

          make -j"$(sysctl -n hw.ncpu)"
          make -j"$(sysctl -n hw.ncpu)"
          make install_sw

          test -f "$OPENSSL_ROOT/lib/libssl.a"
          test -f "$OPENSSL_ROOT/lib/libcrypto.a"
          test -f "$OPENSSL_ROOT/lib/pkgconfig/openssl.pc"

          echo "OPENSSL_PKGCONFIG_DIR=$OPENSSL_ROOT/lib/pkgconfig" >> "$GITHUB_ENV"

      - name: Build static LAME
        shell: bash
        run: |
          set -euo pipefail

          cd "$GITHUB_WORKSPACE/src/lame-${LAME_VERSION}"

          ./configure \
            --prefix="$LAME_ROOT" \
            --disable-shared \
            --enable-static \
            --disable-nasm

          make -j"$(sysctl -n hw.ncpu)"
          make install

          test -f "$LAME_ROOT/lib/libmp3lame.a"
          test -f "$LAME_ROOT/include/lame/lame.h"

          file "$LAME_ROOT/lib/libmp3lame.a"

      - name: Configure FFmpeg
        shell: bash
        run: |
          set -euo pipefail

          set -euo pipefail

          cd "$GITHUB_WORKSPACE/src/ffmpeg-${FFMPEG_VERSION}"

          # Homebrew やシステム側の .pc は完全に検索対象から外す。
          # 自前ビルドした OpenSSL 3 の .pc だけを使う。
          export PKG_CONFIG_PATH=
          export PKG_CONFIG_LIBDIR="$OPENSSL_PKGCONFIG_DIR"

          pkg-config --modversion openssl
          pkg-config --variable=libdir openssl

          ./configure \
            --prefix="$TARGET_DIR" \
            --cc=/usr/bin/clang \
            --arch=arm64 \
            --pkg-config-flags="--static" \
            --extra-cflags="-arch arm64 -I$LAME_ROOT/include -I$OPENSSL_ROOT/include" \
            --extra-ldflags="-arch arm64 -L$LAME_ROOT/lib -L$OPENSSL_ROOT/lib" \
            --extra-libs="$OPENSSL_ROOT/lib/libssl.a $OPENSSL_ROOT/lib/libcrypto.a" \
            --disable-shared \
            --disable-debug \
            --disable-doc \
            --enable-gpl \
            --enable-version3 \
            --enable-libmp3lame \
            --enable-protocol=https \
            --enable-demuxer=hls \
            --enable-muxer=hls \
            --disable-xlib \
            --disable-libxcb \
            --disable-libxcb-shm \
            --disable-libxcb-shape \
            --disable-libxcb-xfixes \
            --disable-indev=xcbgrab\
            --disable-indev=qtkit \
            --disable-indev=x11grab_xcb
#            --pkg-config-flags=--static \
#            --extra-cflags=-fno-stack-check\
#            --cc=/usr/bin/clang \
#            --enable-libaom \
#            --enable-libass \
#            --enable-fontconfig \
#            --enable-libfreetype \
#            --enable-libvorbis \
#            --enable-libharfbuzz \
#            --enable-libkvazaar \
#            --enable-libopenjpeg \
#            --enable-libopus \
#            --enable-libsnappy \
#            --enable-libsvtav1 \
#            --enable-libtheora \
#            --enable-libvidstab \
#            --enable-libvmaf \
#            --enable-libvpx \
#            --enable-libvpx \
#            --enable-libvvenc \
#            --enable-openssl \
#            --enable-libx264 \
#            --enable-libx265 \
#            --enable-libwebp \
#            --enable-libzimg \
#            --enable-ffplay \
#            --enable-neon \
#            --enable-runtime-cpudetect \
      - name: Verify disabled X11 and XCB configuration
        shell: bash
        run: |
          set -euo pipefail

          cd "$GITHUB_WORKSPACE/src/ffmpeg-${FFMPEG_VERSION}"

          grep -E \
            'CONFIG_(XLIB|LIBXCB|LIBXCB_SHM|LIBXCB_SHAPE|LIBXCB_XFIXES|XCBGRAB_INDEV)' \
            config.h || true

          if grep -E \
            '^#define CONFIG_(XLIB|LIBXCB|LIBXCB_SHM|LIBXCB_SHAPE|LIBXCB_XFIXES|XCBGRAB_INDEV) 1$' \
            config.h; then
            echo "ERROR: X11/XCB support was enabled."
            exit 1
          fi

      - name: Build and install FFmpeg
        shell: bash
        run: |
          set -euo pipefail

          cd "$GITHUB_WORKSPACE/src/ffmpeg-${FFMPEG_VERSION}"
          make -j"$(sysctl -n hw.ncpu)"
          make install

      - name: Verify binary and reject unwanted dynamic dependencies
        shell: bash
        run: |
          set -euo pipefail

          FFMPEG="$TARGET_DIR/bin/ffmpeg"

          test -x "$FFMPEG"
          file "$FFMPEG" | grep -E 'arm64|ARM64'

          echo "=== otool -L ==="
          otool -L "$FFMPEG"

          # Reject all Homebrew dependencies, including X11/XCB.
          BAD_DEPS="$(
            otool -L "$FFMPEG" | tail -n +2 | awk '{print $1}' |
              grep -E '(^/opt/homebrew/|/libX11(\.[^/]+)?\.dylib|/libxcb[^/]*\.dylib)' ||
              true
          )"

          if test -n "$BAD_DEPS"; then
            echo "ERROR: unwanted runtime dependencies found:"
            echo "$BAD_DEPS"
            exit 1
          fi

          "$FFMPEG" -version

      - name: Verify required CaptureStream2 features
        shell: bash
        run: |
          set -euo pipefail

          FFMPEG="$TARGET_DIR/bin/ffmpeg"

          "$FFMPEG" -hide_banner -encoders | grep -w libmp3lame
          "$FFMPEG" -hide_banner -protocols | grep -w https
          "$FFMPEG" -hide_banner -demuxers | grep -w hls
          "$FFMPEG" -hide_banner -muxers | grep -w hls

      - name: Package binary
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p package
          cp "$TARGET_DIR/bin/ffmpeg" package/ffmpeg
          chmod +x package/ffmpeg

          tar -czf ffmpeg-macos-arm64.tar.gz -C package ffmpeg

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-macos-arm64
          path: ffmpeg-macos-arm64.tar.gz
          if-no-files-found: error
