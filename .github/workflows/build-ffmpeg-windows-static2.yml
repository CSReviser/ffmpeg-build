name: Build FFmpeg Windows Static

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  FFMPEG_VERSION: "9.0.2"
  MXE_TARGET: "x86_64-w64-mingw32.static"

jobs:
  build:
    name: FFmpeg  / Windows x64 static
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout MXE
        run: |
          git clone --depth 1 https://github.com/mxe/mxe.git mxe

      - name: Install MXE host dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            autoconf \
            automake \
            autopoint \
            bash \
            bison \
            bzip2 \
            flex \
            g++ \
            gettext \
            gperf \
            intltool \
            libtool \
            lzip \
            make \
            p7zip-full \
            patch \
            perl \
            python3 \
            python3-mako \
            python3-packaging \
            python3-setuptools \
            python-is-python3 \
            ruby \
            sed \
            unzip \
            wget \
            xz-utils \
            build-essential \
            autoconf \
            automake \
            autopoint \
            bash \
            bison \
            build-essential \
            bzip2 \
            ca-certificates \
            cmake \
            curl \
            flex \
            g++ \
            g++-multilib \
            gettext \
            git \
            gperf \
            intltool \
            libc6-dev-i386 \
            libclang-dev \
            libgdk-pixbuf2.0-dev \
            libgl-dev \
            libltdl-dev \
            libpcre2-dev \
            libssl-dev \
            libtool \
            libtool-bin \
            libxml-parser-perl \
            lzip \
            make \
            openssl \
            patch \
            perl \
            pkg-config \
            p7zip-full \
            python-is-python3 \
            python3 \
            python3-mako \
            python3-yaml \
            python3-packaging \
            python3-pip \
            python3-pkg-resources \
            python3-setuptools \
            ruby \
            sed \
            sqlite3 \
            unzip \
            wget \
            xz-utils
     
      - name: Create FFmpeg recipe
        working-directory: mxe
        run: |
          cat > src/ffmpeg.mk <<'EOF'
          PKG             := ffmpeg
          $(PKG)_WEBSITE  := https://ffmpeg.org/
          $(PKG)_IGNORE   :=
          $(PKG)_VERSION  := 9.0.2
          $(PKG)_CHECKSUM :=
          $(PKG)_SUBDIR   := $(PKG)-$($(PKG)_VERSION)
          $(PKG)_FILE     := $(PKG)-$($(PKG)_VERSION).tar.xz
          $(PKG)_URL      := https://ffmpeg.org/releases/$($(PKG)_FILE)

          $(PKG)_DEPS     := cc bzip2 gnutls lame libass libbluray libbs2b libcaca \
                             libvpx opencore-amr opus speex theora vidstab \
                             vo-amrwbenc vorbis x264 xvidcore yasm zlib

          # DO NOT ADD fdk-aac OR openssl SUPPORT.
          # FFmpeg is built with GPL support and GnuTLS.
          #
          # This recipe intentionally does not enable:
          #   --enable-libfdk-aac
          #   --enable-openssl

          define $(PKG)_UPDATE
              $(WGET) -q -O- 'https://ffmpeg.org/releases/' | \
                  $(SED) -n 's,.*ffmpeg-\([0-9][^>]*\)\.tar.*,\1,p' | \
                  grep -v 'alpha\|beta\|rc\|git' | \
                  $(SORT) -Vr | \
                  head -1
          endef

          define $(PKG)_BUILD
              cd '$(BUILD_DIR)' && '$(SOURCE_DIR)/configure' \
                  --cross-prefix='$(TARGET)'- \
                  --enable-cross-compile \
                  --arch=x86_64 \
                  --target-os=mingw32 \
                  --prefix='$(PREFIX)/$(TARGET)' \
                  --enable-static \
                  --disable-shared \
                  --disable-debug \
                  --disable-pthreads \
                  --enable-w32threads \
                  --disable-doc \
                  --enable-gpl \
                  --enable-version3 \
                  --enable-gnutls \
                  --enable-libass \
                  --enable-libbluray \
                  --enable-libbs2b \
                  --enable-libcaca \
                  --enable-libmp3lame \
                  --enable-libopencore-amrnb \
                  --enable-libopencore-amrwb \
                  --enable-libopus \
                  --enable-libspeex \
                  --enable-libtheora \
                  --enable-libvidstab \
                  --enable-libvo-amrwbenc \
                  --enable-libvorbis \
                  --enable-libvpx \
                  --enable-libx264 \
                  --enable-libxvid \
                  --disable-sdl2 \
                  --disable-xlib \
                  --extra-libs="`'$(TARGET)-pkg-config' --libs libmpg123` -mconsole" \
                  --extra-ldflags="-static -fstack-protector"

              $(MAKE) -C '$(BUILD_DIR)' -j '$(JOBS)'
              $(MAKE) -C '$(BUILD_DIR)' -j 1 install
          endef
          EOF

      - name: Download FFmpeg and calculate checksum
        working-directory: mxe
        env:
          FFMPEG_VERSION: ${{ env.FFMPEG_VERSION }}
        run: |
          set -eux

          URL="https://ffmpeg.org/releases/ffmpeg-${FFMPEG_VERSION}.tar.xz"
          FILE="ffmpeg-${FFMPEG_VERSION}.tar.xz"

          mkdir -p pkg

          echo "Downloading:"
          echo "  ${URL}"

          wget \
            --https-only \
            --tries=3 \
            --timeout=30 \
            -O "pkg/${FILE}" \
            "${URL}"

          CHECKSUM="$(sha256sum "pkg/${FILE}" | awk '{print $1}')"

          echo
          echo "FFmpeg version : ${FFMPEG_VERSION}"
          echo "FFmpeg file    : ${FILE}"
          echo "SHA-256        : ${CHECKSUM}"
          echo

          if [ "${#CHECKSUM}" -ne 64 ]; then
            echo "Invalid SHA-256 checksum"
            exit 1
          fi

          # Insert the calculated checksum into the MXE recipe.
          sed -i \
            "s/^\$(PKG)_CHECKSUM :=.*/\$(PKG)_CHECKSUM := ${CHECKSUM}/" \
            src/ffmpeg.mk

          echo "=== FFmpeg recipe checksum ==="
          grep -E 'VERSION|CHECKSUM|FILE|URL' src/ffmpeg.mk

      - name: Verify FFmpeg archive
        working-directory: mxe
        run: |
          set -eux

          FILE="ffmpeg-${FFMPEG_VERSION}.tar.xz"

          CHECKSUM="$(grep '^\$(PKG)_CHECKSUM' src/ffmpeg.mk | awk '{print $3}')"

          echo "${CHECKSUM}  pkg/${FILE}" | sha256sum -c -

#      - name: Build FFmpeg
#        working-directory: mxe
#        env:
#          MXE_TARGET: ${{ env.MXE_TARGET }}
#        run: |
#          make \
#            MXE_TARGETS="${MXE_TARGET}" \
#            JOBS="$(nproc)" \
#            ffmpeg

      - name: Build FFmpeg with MXE
        run: |
          set -o pipefail
          cd mxe
          make \
            MXE_TARGETS="${MXE_TARGET}" \
            JOBS="$(nproc)" \
            ffmpeg

      - name: Show FFmpeg failure logs
        if: failure()
        shell: bash
        run: |
          set +e
          TARGET="${MXE_TARGET:-x86_64-w64-mingw32.static}"
          MXE_ROOT="${GITHUB_WORKSPACE}/mxe"
          MXE_LOG="${MXE_ROOT}/log/ffmpeg_${TARGET}"
          BUILD_DIR="${MXE_ROOT}/tmp-ffmpeg-${TARGET}"
          echo "::group::MXE FFmpeg build log"
          if [ -f "${MXE_LOG}" ]; then
            cat "${MXE_LOG}"
          else
            echo "MXE log not found: ${MXE_LOG}"
          fi
          echo "::endgroup::"
          CONFIG_LOG="$(find "${BUILD_DIR}" \
            -type f \
            -path "*/ffbuild/config.log" \
            -print -quit 2>/dev/null)"
          echo "::group::FFmpeg configure errors"
          if [ -n "${CONFIG_LOG}" ]; then
            echo "config.log: ${CONFIG_LOG}"
            echo
            grep -nEi \
              'error|failed|failure|not found|cannot find|undefined reference|unknown option|unsupported' \
              "${CONFIG_LOG}" \
              | tail -n 300 || true
          else
            echo "ffbuild/config.log not found."
          fi
          echo "::endgroup::"
          echo "::group::FFmpeg configure log"
          if [ -n "${CONFIG_LOG}" ]; then
            cat "${CONFIG_LOG}"
          else
            echo "ffbuild/config.log not found."
          fi
          echo "::endgroup::"
          echo "::group::FFmpeg config.mak"
          CONFIG_MAK="$(find "${BUILD_DIR}" \
            -type f \
            -path "*/ffbuild/config.mak" \
            -print -quit 2>/dev/null)"
          if [ -n "${CONFIG_MAK}" ]; then
            cat "${CONFIG_MAK}"
          else
            echo "ffbuild/config.mak not found."
          fi
          echo "::endgroup::"
          echo "::group::FFmpeg build files"
          if [ -d "${BUILD_DIR}" ]; then
            find "${BUILD_DIR}" \
              -maxdepth 3 \
              -type f \
              | sort
          else
            echo "Build directory not found: ${BUILD_DIR}"
          fi
          echo "::endgroup::"

      - name: Inspect FFmpeg
        working-directory: mxe
        run: |
          set -eux

          FFMPEG="usr/${MXE_TARGET}/bin/ffmpeg.exe"

          echo "=== file ==="
          file "${FFMPEG}"

          echo
          echo "=== size ==="
          ls -lh "${FFMPEG}"

          echo
          echo "=== PE DLL dependencies ==="
          x86_64-w64-mingw32-objdump \
            -p "${FFMPEG}" \
            | grep 'DLL Name' || true

          echo
          echo "=== version ==="
          "${FFMPEG}" -version || true

      - name: Prepare artifact
        working-directory: mxe
        env:
          FFMPEG_VERSION: ${{ env.FFMPEG_VERSION }}
          MXE_TARGET: ${{ env.MXE_TARGET }}
        run: |
          set -eux

          mkdir -p ../dist

          cp \
            "usr/${MXE_TARGET}/bin/ffmpeg.exe" \
            "../dist/ffmpeg-${FFMPEG_VERSION}-windows-x64-static.exe"

          (
            cd ../dist
            sha256sum \
              "ffmpeg-${FFMPEG_VERSION}-windows-x64-static.exe" \
              > SHA256SUMS.txt
          )

          ls -lh ../dist
          cat ../dist/SHA256SUMS.txt

      - name: Upload FFmpeg
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-${{ env.FFMPEG_VERSION }}-windows-x64-static
          path: dist/
          if-no-files-found: error
          retention-days: 14
