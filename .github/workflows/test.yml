name: Build FFmpeg Windows ARM64 Static

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  FFMPEG_VERSION: "9.1"
  TARGET: "aarch64-w64-mingw32"
  LLVM_MINGW_TAG: "20261117"

jobs:
  build:
    name: FFmpeg / Windows ARM64 static
    runs-on: ubuntu-24.04

    steps:
      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            git \
            make \
            nasm \
            perl \
            pkg-config \
            tar \
            xz-utils

      - name: Setup llvm-mingw
        run: |
          set -eux
          ARCHIVE="llvm-mingw-${LLVM_MINGW_TAG}-ucrt-ubuntu-22.04-x86_64.tar.xz"
          URL="https://github.com/mstorsjo/llvm-mingw/releases/download/${LLVM_MINGW_TAG}/${ARCHIVE}"
          curl -fsSL -o "${ARCHIVE}" "${URL}"
          tar -xf "${ARCHIVE}"
          DIR_NAME="llvm-mingw-${LLVM_MINGW_TAG}-ucrt-ubuntu-22.04-x86_64"
          echo "$(pwd)/${DIR_NAME}/bin" >> "$GITHUB_PATH"

      - name: Download FFmpeg
        run: |
          set -eux
          URL="https://ffmpeg.org/releases/ffmpeg-${FFMPEG_VERSION}.tar.xz"
          FILE="ffmpeg-${FFMPEG_VERSION}.tar.xz"
          curl -fsSL -o "${FILE}" "${URL}"
          tar -xf "${FILE}"

      - name: Configure and build FFmpeg (static)
        working-directory: ffmpeg-${FFMPEG_VERSION}
        run: |
          set -eux
          mkdir -p build_arm64
          cd build_arm64

          ../configure \
            --prefix="$(pwd)/out" \
            --arch=aarch64 \
            --target-os=mingw32 \
            --cross-prefix="${TARGET}-" \
            --cc="${TARGET}-clang" \
            --cxx="${TARGET}-clang++" \
            --ar="${TARGET}-llvm-ar" \
            --ranlib="${TARGET}-llvm-ranlib" \
            --strip="${TARGET}-llvm-strip" \
            --enable-cross-compile \
            --enable-static \
            --disable-shared \
            --disable-debug \
            --disable-doc \
            --enable-gpl \
            --enable-version3 \
            --extra-ldflags="-static"

          make -j"$(nproc)"
          make install

      - name: Inspect binary
        run: |
          set -eux
          FFMPEG_EXE="ffmpeg-${FFMPEG_VERSION}/build_arm64/out/bin/ffmpeg.exe"
          file "${FFMPEG_EXE}"
          ls -lh "${FFMPEG_EXE}"
          "${TARGET}-objdump" -p "${FFMPEG_EXE}" | grep 'DLL Name' || true

      - name: Prepare artifact
        run: |
          set -eux
          mkdir -p dist
          cp \
            "ffmpeg-${FFMPEG_VERSION}/build_arm64/out/bin/ffmpeg.exe" \
            "dist/ffmpeg-${FFMPEG_VERSION}-windows-arm64-static.exe"
          (
            cd dist
            sha256sum "ffmpeg-${FFMPEG_VERSION}-windows-arm64-static.exe" > SHA256SUMS.txt
          )
          ls -lh dist
          cat dist/SHA256SUMS.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-${{ env.FFMPEG_VERSION }}-windows-arm64-static
          path: dist/
          if-no-files-found: error
          retention-days: 14
