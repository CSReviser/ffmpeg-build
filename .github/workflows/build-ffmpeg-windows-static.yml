name: Build FFmpeg Windows Static

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-ffmpeg-windows-static.yml"

permissions:
  contents: read

env:
  FFMPEG_VERSION: "9.0.2"
  FFMPEG_SHA256: "733984395e0dbbe5c046abda2dc49a5544e7e0e1e2366bba849222ae9e3a03b1"
  MXE_TARGET: "x86_64-w64-mingw32.static"

jobs:
  build:
    name: FFmpeg ${ env.FFMPEG_VERSION } / Windows x64 static
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install MXE host dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            autoconf \
            automake \
            autopoint \
            bash \
            bison \
            bzip2 \
            flex \
            g++ \
            g++-multilib \
            gettext \
            git \
            gperf \
            intltool \
            libc6-dev-i386 \
            libclang-dev \
            libgdk-pixbuf2.0-dev \
            libltdl-dev \
            libgl-dev \
            libpcre2-dev \
            libssl-dev \
            libtool-bin \
            libxml-parser-perl \
            lzip \
            make \
            openssl \
            p7zip-full \
            patch \
            perl \
            python3 \
            python3-mako \
            python3-packaging \
            python3-setuptools \
            python-is-python3 \
            ruby \
            sed \
            sqlite3 \
            unzip \
            wget \
            xz-utils

      - name: Cache MXE
        id: cache-mxe
        uses: actions/cache@v4
        with:
          path: mxe
          key: mxe-${{ runner.os }}-${{ runner.arch }}-${{ env.MXE_TARGET }}-ffmpeg-${{ env.FFMPEG_VERSION }}-${{ hashFiles('.github/workflows/build-ffmpeg-windows-static.yml') }}
          restore-keys: |
            mxe-${{ runner.os }}-${{ runner.arch }}-${{ env.MXE_TARGET }}-

      - name: Checkout MXE
        if: steps.cache-mxe.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 https://github.com/mxe/mxe.git mxe

- name: Checkout MXE
  run: |
    git clone --depth 1 https://github.com/mxe/mxe.git mxe

- name: Replace MXE FFmpeg recipe
  working-directory: mxe
  run: |
    cat > src/ffmpeg.mk <<'EOF'
    PKG             := ffmpeg
    $(PKG)_WEBSITE  := https://ffmpeg.org/
    $(PKG)_IGNORE   :=
    $(PKG)_VERSION  := 9.0.2
    $(PKG)_CHECKSUM := 733984395e0dbbe5c046abda2dc49a5544e7e0e1e2366bba849222ae9e3a03b1
    $(PKG)_SUBDIR   := $(PKG)-$($(PKG)_VERSION)
    $(PKG)_FILE     := $(PKG)-$($(PKG)_VERSION).tar.xz
    $(PKG)_URL      := https://ffmpeg.org/releases/$($(PKG)_FILE)

    $(PKG)_DEPS     := cc bzip2 gnutls lame libass libbluray libbs2b libcaca \
                       libvpx opencore-amr opus speex theora vidstab \
                       vo-amrwbenc vorbis x264 xvidcore yasm zlib

    define $(PKG)_UPDATE
        $(WGET) -q -O- 'https://ffmpeg.org/releases/' | \
            $(SED) -n 's,.*ffmpeg-\([0-9][^>]*\)\.tar.*,\1,p' | \
            grep -v 'alpha\|beta\|rc\|git' | \
            $(SORT) -Vr | \
            head -1
    endef

    define $(PKG)_BUILD
        cd '$(BUILD_DIR)' && '$(SOURCE_DIR)/configure' \
            --cross-prefix='$(TARGET)'- \
            --enable-cross-compile \
            --arch=x86_64 \
            --target-os=mingw32 \
            --prefix='$(PREFIX)/$(TARGET)' \
            --enable-static \
            --disable-shared \
            --yasmexe='$(TARGET)-yasm' \
            --disable-debug \
            --disable-pthreads \
            --enable-w32threads \
            --disable-doc \
            --disable-programs \
            --enable-gpl \
            --enable-version3 \
            --enable-gnutls \
            --enable-libass \
            --enable-libbluray \
            --enable-libbs2b \
            --enable-libcaca \
            --enable-libmp3lame \
            --enable-libopencore-amrnb \
            --enable-libopencore-amrwb \
            --enable-libopus \
            --enable-libspeex \
            --enable-libtheora \
            --enable-libvidstab \
            --enable-libvo-amrwbenc \
            --enable-libvorbis \
            --enable-libvpx \
            --enable-libx264 \
            --enable-libxvid \
            --disable-sdl2 \
            --disable-xlib \
            --extra-libs='-mconsole' \
            --extra-ldflags="-static -fstack-protector"

        $(MAKE) -C '$(BUILD_DIR)' -j '$(JOBS)'
        $(MAKE) -C '$(BUILD_DIR)' -j 1 install
    endef
    EOF

    echo "=== FFmpeg recipe ==="
    cat src/ffmpeg.mk


      - name: Patch MXE FFmpeg recipe
        working-directory: mxe
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path("src/ffmpeg.mk")
          text = path.read_text()

          old_version = "$(PKG)_VERSION := 9.0.1"
          old_checksum = "$(PKG)_CHECKSUM := cf38e0e28c7e5605942c4a77755349b0145804a397af37eb1fb4c77cb237f635"

          new_version = "$(PKG)_VERSION := 9.0.2"
          new_checksum = "$(PKG)_CHECKSUM := 733984395e0dbbe5c046abda2dc49a5544e7e0e1e2366bba849222ae9e3a03b1"

          if old_version not in text:
              raise SystemExit(
                  "Unexpected MXE ffmpeg.mk: version line was not found"
              )

          if old_checksum not in text:
              raise SystemExit(
                  "Unexpected MXE ffmpeg.mk: checksum line was not found"
              )

          text = text.replace(old_version, new_version, 1)
          text = text.replace(old_checksum, new_checksum, 1)

          # Do not build x265.  The requested FFmpeg configuration
          # only enables x264/xvid.
          text = text.replace(
              "libvpx opencore-amr $(BUILD)~nasm opus sdl2 speex theora vidstab "
              "vo-amrwbenc vorbis x264 x265 xvidcore zlib",
              "libvpx opencore-amr $(BUILD)~nasm opus sdl2 speex theora vidstab "
              "vo-amrwbenc vorbis x264 xvidcore zlib",
              1,
          )

          # Explicitly keep OpenSSL and FDK-AAC out.
          text = text.replace(
              "        --enable-libx264 \\\n"
              "        --enable-libx265 \\\n"
              "        --enable-libxvid \\\n",
              "        --enable-libx264 \\\n"
              "        --enable-libxvid \\\n",
              1,
          )

          # Avoid pulling SDL/X11 support merely because MXE has SDL2.
          marker = "        --enable-libxvid \\\n"
          replacement = (
              "        --enable-libxvid \\\n"
              "        --disable-sdl2 \\\n"
              "        --disable-xlib \\\n"
          )

          if marker not in text:
              raise SystemExit(
                  "Unexpected MXE ffmpeg.mk: configure marker was not found"
              )

          text = text.replace(marker, replacement, 1)

          path.write_text(text)
          PY

          echo "=== Patched MXE ffmpeg.mk ==="
          sed -n '1,140p' src/ffmpeg.mk

      - name: Build FFmpeg
        working-directory: mxe
        env:
          MXE_TARGETS: ${{ env.MXE_TARGET }}
        run: |
          make \
            MXE_TARGETS="${MXE_TARGET}" \
            JOBS="$(nproc)" \
            ffmpeg

      - name: Show FFmpeg information
        working-directory: mxe
        run: |
          echo "=== executable ==="
          ls -lh "usr/${MXE_TARGET}/bin/ffmpeg.exe"

          echo
          echo "=== file ==="
          file "usr/${MXE_TARGET}/bin/ffmpeg.exe"

          echo
          echo "=== PE dependencies ==="
          x86_64-w64-mingw32.static-objdump \
            -p "usr/${MXE_TARGET}/bin/ffmpeg.exe" \
            | grep -E 'DLL Name|ImageBase|Subsystem' || true

          echo
          echo "=== FFmpeg version ==="
          "usr/${MXE_TARGET}/bin/ffmpeg.exe" \
            -version || true

      - name: Prepare artifact
        run: |
          set -eux

          mkdir -p dist

          cp \
            "mxe/usr/${MXE_TARGET}/bin/ffmpeg.exe" \
            "dist/ffmpeg-${FFMPEG_VERSION}-windows-x64-static.exe"

          sha256sum \
            "dist/ffmpeg-${FFMPEG_VERSION}-windows-x64-static.exe" \
            > "dist/SHA256SUMS.txt"

          ls -lh dist
          cat dist/SHA256SUMS.txt

      - name: Upload FFmpeg
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-${{ env.FFMPEG_VERSION }}-windows-x64-static
          path: dist/
          if-no-files-found: error
          retention-days: 14
